version: '3.8'

services:
  db:
    image: postgres:15
    container_name: m11_postgres
    restart: always
    environment:
      POSTGRES_USER: m11_user
      POSTGRES_PASSWORD: m11_password
      POSTGRES_DB: m11_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m11_user -d m11_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: m11_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
